name: Build unsigned iOS diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: bash scripts/build-unsigned.sh '${{ matrix.sdk }}'
      - name: Upload unsigned device IPA
        if: success() && matrix.sdk == 'iphoneos'
        uses: actions/upload-artifact@v4
        with:
          name: NativeDiagnostics-unsigned-IPA
          path: output/NativeDiagnostics-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.sdk }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
